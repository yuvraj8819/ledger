<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Balance">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Money, steps and food in one private app.">
  <title>Balance</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png?v=2" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <link rel="preload" href="fonts/figures.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css?v=2.0.0">
  <script>try{var t=(JSON.parse(localStorage.getItem('ledger.v1')||'{}').settings||{}).theme;if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';if(t)document.documentElement.dataset.theme=t==='light'?'light':'dark'}catch(e){}</script>
</head>
<body>
  <div id="app"></div>
  <div id="chrome"></div>
  <noscript>Balance needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js?v=2.0.0"></script>
</body>
</html>
