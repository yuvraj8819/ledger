<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger tests</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 16px; background: Canvas; color: CanvasText; }
  .ok { color: #16a06b; } .bad { color: #d9382d; font-weight: bold; }
  #sum { font-size: 18px; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="sum">Running…</div>
<div id="out"></div>
<script type="module">
import * as C from '../js/calc.js';
import * as S from '../js/store.js';

const results = [];
const test = (name, fn) => { try { fn(); results.push([name, true]); } catch (e) { results.push([name, false, e.message]); } };
const eq = (a, b, msg = '') => { const A = JSON.stringify(a), B = JSON.stringify(b); if (A !== B) throw new Error(`${msg} expected ${B}, got ${A}`); };
const throws = (fn) => { try { fn(); } catch { return; } throw new Error('expected a throw'); };

const base = (entries = [], settings = {}) => ({ ...S.defaultState(), settings: { ...S.defaultState().settings, ...settings }, entries });
const E = (o) => ({ id: Math.random().toString(36), date: '2026-11-10', method: 'upi', accountId: 'acc_savings', ...o });

test('paise conversion avoids float drift', () => { eq(C.toPaise(0.1) + C.toPaise(0.2), 30); eq(C.toPaise('93157'), 9315700); });
test('days left in month counts today', () => { eq(C.daysLeftInMonth('2026-11-10'), 21); eq(C.daysLeftInMonth('2026-02-28'), 1); eq(C.daysLeftInMonth('2028-02-01'), 29); });
test('balances: cash vs bank vs card', () => {
  const s = base([
    E({ type: 'received', amount: 9074000, method: 'cash' }),
    E({ type: 'received', amount: 241700, method: 'upi' }),
    E({ type: 'spent', amount: 10000, method: 'cash' }),
    E({ type: 'spent', amount: 5000, method: 'debit' }),
    E({ type: 'spent', amount: 20000, method: 'credit' }),
    E({ type: 'spent', amount: 99900, method: 'upi', offBalance: true }),
  ]);
  const b = C.balances(s);
  eq(b.cash, 9064000, 'cash'); eq(b.bank, 236700, 'bank'); eq(b.card, 20000, 'card'); eq(b.total, 9300700, 'total');
});
test('opening balances count', () => { const b = C.balances(base([], { openingCash: 100, openingBank: 200 })); eq(b.total, 300); });
test('transfers: wallet moves and card bill', () => {
  const s = base([
    E({ type: 'received', amount: 10000, method: 'upi' }),
    E({ type: 'transfer', kind: 'toCash', amount: 3000 }),
    E({ type: 'spent', amount: 2000, method: 'credit' }),
    E({ type: 'transfer', kind: 'cardBill', amount: 2000 }),
    E({ type: 'transfer', kind: 'account', amount: 1000, accountId: 'acc_savings', toAccountId: 'acc_personal' }),
  ]);
  const b = C.balances(s);
  eq([b.cash, b.bank, b.card], [3000, 5000, 0]);
  const a = C.accountBalances(s);
  eq(a.find((x) => x.id === 'acc_savings').left, 7000);
  eq(a.find((x) => x.id === 'acc_personal').left, 1000);
  eq(a.reduce((t, x) => t + x.left, 0), 8000, 'buckets sum to total');
});
test('accounts total matches home total (no card dues)', () => {
  const s = S.demoState();
  s.entries = s.entries.filter((e) => e.method !== 'credit');
  const a = C.accountBalances(s).reduce((t, x) => t + x.left, 0);
  eq(a, C.balances(s).total);
});
test('safe to spend matches the reference screen (₹93,157 / 21 days = ₹4,436)', () => {
  const s = base([E({ type: 'received', amount: 9315700, date: '2026-11-08' })]);
  const r = C.safeToSpend(s, '2026-11-10');
  eq(r.perDay, 443600); eq(r.daysLeft, 21); eq(r.left, 443600);
});
test('safe to spend: spending today lowers what is left, not the daily figure', () => {
  const s = base([E({ type: 'received', amount: 2100000, date: '2026-11-01' }), E({ type: 'spent', amount: 50000 })]);
  const r = C.safeToSpend(s, '2026-11-10');
  eq(r.perDay, 100000); eq(r.spentToday, 50000); eq(r.left, 50000); eq(r.progress, 0.5);
});
test('safe to spend with a monthly budget', () => {
  const s = base([E({ type: 'spent', amount: 300000, date: '2026-11-02' })], { monthlyBudget: 1350000 });
  const r = C.safeToSpend(s, '2026-11-10');
  eq(r.usedBudget, true); eq(r.perDay, Math.floor((1350000 - 300000) / 21 / 100) * 100);
});
test('summaries split spent, for others, received', () => {
  const r = C.summarize([E({ type: 'spent', amount: 100 }), E({ type: 'forSomeone', amount: 50 }), E({ type: 'received', amount: 500 }), E({ type: 'transfer', kind: 'account', amount: 999 })]);
  eq([r.spent, r.forOthers, r.received, r.net], [150, 50, 500, 350]);
});
test('period ranges', () => {
  eq(C.periodRange('7d', '2026-11-10'), ['2026-11-04', '2026-11-10']);
  eq(C.periodRange('month', '2026-11-10'), ['2026-11-01', '2026-11-10']);
});
test('groupSum shares', () => {
  const g = C.groupSum([E({ amount: 7800, sourceId: 'a' }), E({ amount: 1500, sourceId: 'b' }), E({ amount: 700, sourceId: 'a' })], (e) => e.sourceId);
  eq(g[0].key, 'a'); eq(g[0].amount, 8500); eq(Math.round(g[0].share * 100), 85); eq(g[0].count, 2);
});
test('people: owed minus paid back', () => {
  const s = base([E({ type: 'forSomeone', amount: 45000, personId: 'p', expectBack: true }), E({ type: 'forSomeone', amount: 10000, personId: 'p' }), E({ type: 'received', amount: 20000, personId: 'p', settles: true })]);
  s.people = [{ id: 'p', name: 'Aman' }];
  const p = C.peopleSummary(s)[0];
  eq([p.spentFor, p.owed, p.paidBack, p.owes], [55000, 45000, 20000, 25000]);
});
test('recurring bills: catch up missed months, clamp day 31', () => {
  const s = base(); s.recurring = [{ id: 'r', day: 31, startMonth: '2026-09', lastPosted: null }];
  eq(C.dueRecurring(s, '2026-11-10').map((d) => d.date), ['2026-09-30', '2026-10-31']);
  s.recurring[0].lastPosted = '2026-10';
  eq(C.dueRecurring(s, '2026-11-10'), []);
  eq(C.dueRecurring(s, '2026-11-30').map((d) => d.date), ['2026-11-30']);
  s.recurring[0].paused = true; eq(C.dueRecurring(s, '2026-12-31'), []);
});
test('rewind windows', () => {
  eq(C.rewindWindow('weekly', '2026-11-10'), { from: '2026-11-02', to: '2026-11-08', label: 'Last week' });
  const m = C.rewindWindow('monthly', '2026-11-10'); eq([m.from, m.to], ['2026-10-01', '2026-10-31']);
});
test('rewind stats', () => {
  const s = base([E({ type: 'spent', amount: 1000, date: '2026-11-03', categoryId: 'cat_food' }), E({ type: 'spent', amount: 3000, date: '2026-11-04', categoryId: 'cat_travel' }), E({ type: 'spent', amount: 2000, date: '2026-10-28' })]);
  const r = C.rewind(s, '2026-11-02', '2026-11-08');
  eq([r.spent, r.days, r.noSpendDays, r.prevSpent, r.topCat.key, r.biggest.amount], [4000, 7, 5, 2000, 'cat_travel', 3000]);
  eq(r.change, 1);
});
test('calculator', () => {
  eq(C.evaluate('120+80×2'), 280); eq(C.evaluate('(120+80)×2'), 400); eq(C.evaluate('1,200÷4'), 300);
  eq(C.evaluate('200+10%'), 220); eq(C.evaluate('50%'), 0.5); eq(C.evaluate('−5+10'), 5); eq(C.evaluate('0.1+0.2'), 0.3);
  throws(() => C.evaluate('5÷0')); throws(() => C.evaluate('2+')); throws(() => C.evaluate('alert(1)'));
});
test('UPI links round-trip', () => {
  const link = C.upiLink({ vpa: 'aman@okaxis', name: 'Aman K', amount: 45050, note: 'Dinner' });
  eq(link, 'upi://pay?pa=aman%40okaxis&pn=Aman+K&cu=INR&am=450.50&tn=Dinner');
  eq(C.parseUpi(link), { vpa: 'aman@okaxis', name: 'Aman K', amount: 45050 });
  eq(C.parseUpi('shop@paytm').vpa, 'shop@paytm'); eq(C.parseUpi('hello'), null);
});
test('CSV escapes commas and quotes', () => {
  const s = base([E({ type: 'spent', amount: 12345, note: 'Pizza, "large"', time: '10:00' })]);
  const lines = C.toCSV(s).split('\n');
  eq(lines.length, 2); if (!lines[1].includes('"Pizza, ""large"""')) throw new Error(lines[1]); if (!lines[1].includes('123.45')) throw new Error('amount');
});
test('backup parse rejects junk and migrates', () => {
  throws(() => S.parseBackup('{"foo":1}'));
  const st = S.parseBackup(JSON.stringify({ state: { accounts: [{ id: 'a', name: 'A' }], entries: [], settings: { theme: 'light' } } }));
  eq(st.settings.theme, 'light'); eq(st.settings.rewind, 'weekly');
});
test('demo data is consistent', () => {
  const d = S.demoState();
  for (const e of d.entries) { if (!(e.amount > 0)) throw new Error('bad amount'); if (!/^\d{4}-\d\d-\d\d$/.test(e.date)) throw new Error('bad date'); }
  if (C.balances(d).total <= 0) throw new Error('demo balance should be positive');
});

const failed = results.filter((r) => !r[1]);
document.getElementById('sum').innerHTML = failed.length ? `<span class="bad">${failed.length} of ${results.length} failed</span>` : `<span class="ok">All ${results.length} tests passed</span>`;
document.getElementById('out').innerHTML = results.map(([n, ok, m]) => `<div class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${n}${m ? ' — ' + m : ''}</div>`).join('');
window.__results = { total: results.length, failed: failed.map((f) => f[0] + ': ' + f[2]) };
</script>
</body>
</html>
