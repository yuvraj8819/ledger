<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger tests</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 16px; background: Canvas; color: CanvasText; }
  .ok { color: #16a06b; } .bad { color: #d9382d; font-weight: bold; }
  #sum { font-size: 18px; margin-bottom: 12px; }

<body>
<div id="sum">Running…</div>
<div id="out"></div>
<script type="module">
import * as C from '../js/calc.js';
import * as S from '../js/store.js';
import * as H from '../js/health.js';
import * as N from '../js/nutrition.js';
import * as F from '../js/foods.js';

const results = [];
const test = (name, fn) => { try { fn(); results.push([name, true]); } catch (e) { results.push([name, false, e.message]); } };
const eq = (a, b, msg = '') => { const A = JSON.stringify(a), B = JSON.stringify(b); if (A !== B) throw new Error(`${msg} expected ${B}, got ${A}`); };
const throws = (fn) => { try { fn(); } catch { return; } throw new Error('expected a throw'); };

const base = (entries = [], settings = {}) => ({ ...S.defaultState(), settings: { ...S.defaultState().settings, ...settings }, entries });
const E = (o) => ({ id: Math.random().toString(36), date: '2026-11-10', method: 'upi', accountId: 'acc_savings', ...o });

test('paise conversion avoids float drift', () => { eq(C.toPaise(0.1) + C.toPaise(0.2), 30); eq(C.toPaise('93157'), 9315700); });
test('days left in month counts today', () => { eq(C.daysLeftInMonth('2026-11-10'), 21); eq(C.daysLeftInMonth('2026-02-28'), 1); eq(C.daysLeftInMonth('2028-02-01'), 29); });
test('balances: cash vs bank vs card', () => {
  const s = base([
    E({ type: 'received', amount: 9074000, method: 'cash' }),
    E({ type: 'received', amount: 241700, method: 'upi' }),
    E({ type: 'spent', amount: 10000, method: 'cash' }),
    E({ type: 'spent', amount: 5000, method: 'debit' }),
    E({ type: 'spent', amount: 20000, method: 'credit' }),
    E({ type: 'spent', amount: 99900, method: 'upi', offBalance: true }),
  ]);
  const b = C.balances(s);
  eq(b.cash, 9064000, 'cash'); eq(b.bank, 236700, 'bank'); eq(b.card, 20000, 'card'); eq(b.total, 9300700, 'total');
});
test('opening balances count', () => { const b = C.balances(base([], { openingCash: 100, openingBank: 200 })); eq(b.total, 300); });
test('transfers: wallet moves and card bill', () => {
  const s = base([
    E({ type: 'received', amount: 10000, method: 'upi' }),
    E({ type: 'transfer', kind: 'toCash', amount: 3000 }),
    E({ type: 'spent', amount: 2000, method: 'credit' }),
    E({ type: 'transfer', kind: 'cardBill', amount: 2000 }),
    E({ type: 'transfer', kind: 'account', amount: 1000, accountId: 'acc_savings', toAccountId: 'acc_personal' }),
  ]);
  const b = C.balances(s);
  eq([b.cash, b.bank, b.card], [3000, 5000, 0]);
  const a = C.accountBalances(s);
  eq(a.find((x) => x.id === 'acc_savings').left, 7000);
  eq(a.find((x) => x.id === 'acc_personal').left, 1000);
  eq(a.reduce((t, x) => t + x.left, 0), 8000, 'buckets sum to total');
});
test('accounts total matches home total (no card dues)', () => {
  const s = S.demoState();
  s.entries = s.entries.filter((e) => e.method !== 'credit');
  const a = C.accountBalances(s).reduce((t, x) => t + x.left, 0);
  eq(a, C.balances(s).total);
});
test('safe to spend matches the reference screen (₹93,157 / 21 days = ₹4,436)', () => {
  const s = base([E({ type: 'received', amount: 9315700, date: '2026-11-08' })]);
  const r = C.safeToSpend(s, '2026-11-10');
  eq(r.perDay, 443600); eq(r.daysLeft, 21); eq(r.left, 443600);
});
test('safe to spend: spending today lowers what is left, not the daily figure', () => {
  const s = base([E({ type: 'received', amount: 2100000, date: '2026-11-01' }), E({ type: 'spent', amount: 50000 })]);
  const r = C.safeToSpend(s, '2026-11-10');
  eq(r.perDay, 100000); eq(r.spentToday, 50000); eq(r.left, 50000); eq(r.progress, 0.5);
});
test('safe to spend with a monthly budget', () => {
  const s = base([E({ type: 'spent', amount: 300000, date: '2026-11-02' })], { monthlyBudget: 1350000 });
  const r = C.safeToSpend(s, '2026-11-10');
  eq(r.usedBudget, true); eq(r.perDay, Math.floor((1350000 - 300000) / 21 / 100) * 100);
});
test('summaries split spent, for others, received', () => {
  const r = C.summarize([E({ type: 'spent', amount: 100 }), E({ type: 'forSomeone', amount: 50 }), E({ type: 'received', amount: 500 }), E({ type: 'transfer', kind: 'account', amount: 999 })]);
  eq([r.spent, r.forOthers, r.received, r.net], [150, 50, 500, 350]);
});
test('period ranges', () => {
  eq(C.periodRange('7d', '2026-11-10'), ['2026-11-04', '2026-11-10']);
  eq(C.periodRange('month', '2026-11-10'), ['2026-11-01', '2026-11-10']);
});
test('groupSum shares', () => {
  const g = C.groupSum([E({ amount: 7800, sourceId: 'a' }), E({ amount: 1500, sourceId: 'b' }), E({ amount: 700, sourceId: 'a' })], (e) => e.sourceId);
  eq(g[0].key, 'a'); eq(g[0].amount, 8500); eq(Math.round(g[0].share * 100), 85); eq(g[0].count, 2);
});
test('people: owed minus paid back', () => {
  const s = base([E({ type: 'forSomeone', amount: 45000, personId: 'p', expectBack: true }), E({ type: 'forSomeone', amount: 10000, personId: 'p' }), E({ type: 'received', amount: 20000, personId: 'p', settles: true })]);
  s.people = [{ id: 'p', name: 'Aman' }];
  const p = C.peopleSummary(s)[0];
  eq([p.spentFor, p.owed, p.paidBack, p.owes], [55000, 45000, 20000, 25000]);
});
test('recurring bills: catch up missed months, clamp day 31', () => {
  const s = base(); s.recurring = [{ id: 'r', day: 31, startMonth: '2026-09', lastPosted: null }];
  eq(C.dueRecurring(s, '2026-11-10').map((d) => d.date), ['2026-09-30', '2026-10-31']);
  s.recurring[0].lastPosted = '2026-10';
  eq(C.dueRecurring(s, '2026-11-10'), []);
  eq(C.dueRecurring(s, '2026-11-30').map((d) => d.date), ['2026-11-30']);
  s.recurring[0].paused = true; eq(C.dueRecurring(s, '2026-12-31'), []);
});
test('rewind windows', () => {
  eq(C.rewindWindow('weekly', '2026-11-10'), { from: '2026-11-02', to: '2026-11-08', label: 'Last week' });
  const m = C.rewindWindow('monthly', '2026-11-10'); eq([m.from, m.to], ['2026-10-01', '2026-10-31']);
});
test('rewind stats', () => {
  const s = base([E({ type: 'spent', amount: 1000, date: '2026-11-03', categoryId: 'cat_food' }), E({ type: 'spent', amount: 3000, date: '2026-11-04', categoryId: 'cat_travel' }), E({ type: 'spent', amount: 2000, date: '2026-10-28' })]);
  const r = C.rewind(s, '2026-11-02', '2026-11-08');
  eq([r.spent, r.days, r.noSpendDays, r.prevSpent, r.topCat.key, r.biggest.amount], [4000, 7, 5, 2000, 'cat_travel', 3000]);
  eq(r.change, 1);
});
test('calculator', () => {
  eq(C.evaluate('120+80×2'), 280); eq(C.evaluate('(120+80)×2'), 400); eq(C.evaluate('1,200÷4'), 300);
  eq(C.evaluate('200+10%'), 220); eq(C.evaluate('50%'), 0.5); eq(C.evaluate('−5+10'), 5); eq(C.evaluate('0.1+0.2'), 0.3);
  throws(() => C.evaluate('5÷0')); throws(() => C.evaluate('2+')); throws(() => C.evaluate('alert(1)'));
});
test('UPI links round-trip', () => {
  const link = C.upiLink({ vpa: 'aman@okaxis', name: 'Aman K', amount: 45050, note: 'Dinner' });
  eq(link, 'upi://pay?pa=aman%40okaxis&pn=Aman+K&cu=INR&am=450.50&tn=Dinner');
  eq(C.parseUpi(link), { vpa: 'aman@okaxis', name: 'Aman K', amount: 45050 });
  eq(C.upiLink({ vpa: 'a@b', amount: 100 }, 'gpay'), 'tez://upi/pay?pa=a%40b&pn=a%40b&cu=INR&am=1.00');
  eq(C.upiLink({ vpa: 'a@b' }, 'phonepe').startsWith('phonepe://pay?'), true);
  eq(C.parseUpi('shop@paytm').vpa, 'shop@paytm'); eq(C.parseUpi('hello'), null);
});
test('CSV escapes commas and quotes', () => {
  const s = base([E({ type: 'spent', amount: 12345, note: 'Pizza, "large"', time: '10:00' })]);
  const lines = C.toCSV(s).split('\n');
  eq(lines.length, 2); if (!lines[1].includes('"Pizza, ""large"""')) throw new Error(lines[1]); if (!lines[1].includes('123.45')) throw new Error('amount');
});
test('backup parse rejects junk and migrates', () => {
  throws(() => S.parseBackup('{"foo":1}'));
  const st = S.parseBackup(JSON.stringify({ state: { accounts: [{ id: 'a', name: 'A' }], entries: [], settings: { theme: 'light' } } }));
  eq(st.settings.theme, 'light'); eq(st.settings.rewind, 'weekly');
});
test('demo data is consistent', () => {
  const d = S.demoState();
  for (const e of d.entries) { if (!(e.amount > 0)) throw new Error('bad amount'); if (!/^\d{4}-\d\d-\d\d$/.test(e.date)) throw new Error('bad date'); }
  if (C.balances(d).total <= 0) throw new Error('demo balance should be positive');
});

// ---------- health: steps + food rules ----------
const hs = (days, extra = {}) => { const s = S.defaultState(); s.health = { ...H.defaultHealth(), enabled: true, startDate: '2026-11-01', calorieGoal: 2000, ...extra, days }; return s; };
const meal = (kcal, cheat = false) => ({ id: Math.random().toString(36), name: 'x', kcal, cheat });
const R = H.rulesOf(H.defaultHealth());
test('health: 10,000 steps earns +₹500, nothing taken', () => {
  const v = H.verdict({ steps: 10000, meals: [meal(1800)] }, { ...R, calorieGoal: 2000 });
  eq([v.reward, v.penalty, v.net], [50000, 0, 50000]);
});
test('health: missed steps costs ₹1,000', () => {
  const v = H.verdict({ steps: 9999, meals: [] }, { ...R, calorieGoal: 2000 });
  eq([v.reward, v.penalty], [0, 100000]); eq(v.reasons, ['missed steps']);
});
test('health: missed steps AND overeating is still one ₹1,000, never two', () => {
  const v = H.verdict({ steps: 3000, meals: [meal(2600), meal(300, true)] }, { ...R, calorieGoal: 2000 });
  eq([v.reward, v.penalty, v.net], [0, 100000, -100000]);
  const s = hs({ '2026-11-05': { steps: 3000, meals: [meal(2600), meal(300, true)] } });
  H.syncHealth(s, '2026-11-11'); eq(s.entries.length, 1); eq(C.balances(s).total, -100000);
});
test('health: overeating by the margin (500) costs ₹1,000; 499 over does not', () => {
  const r = { ...R, calorieGoal: 2000 };
  eq(H.verdict({ steps: 12000, meals: [meal(2499)] }, r).penalty, 0);
  eq(H.verdict({ steps: 12000, meals: [meal(2500)] }, r).penalty, 100000);
});
test('health: a cheat meal counts as overeating whatever the calories', () => {
  const v = H.verdict({ steps: 12000, meals: [meal(400, true)] }, { ...R, calorieGoal: 2000 });
  eq(v.penalty, 100000); eq(v.reasons, ['cheat meal']);
});
test('health: steps hit but overate = +₹500 and −₹1,000', () => {
  const v = H.verdict({ steps: 15000, meals: [meal(3000)] }, { ...R, calorieGoal: 2000 }); eq([v.reward, v.penalty, v.net], [50000, 100000, -50000]);
});
test('health: settling is idempotent and moves the bank balance', () => {
  const s = hs({ '2026-11-09': { steps: 11000, meals: [] }, '2026-11-10': { steps: 2000, meals: [] } });
  const c1 = H.syncHealth(s, '2026-11-11');
  eq(c1.map((c) => [c.day, c.delta]), [['2026-11-09', 50000], ['2026-11-10', -100000]]);
  eq(H.syncHealth(s, '2026-11-11'), []); eq(H.syncHealth(s, '2026-11-12'), []);
  eq(s.entries.length, 2); const b = C.balances(s); eq([b.bank, b.cash], [-50000, 0]);
  eq(s.entries.find((e) => e.type === 'received').date, '2026-11-09'); eq(s.entries[0].time, '23:59');
});
test('health: today and days before the start date never settle', () => {
  const s = hs({ '2026-10-31': { steps: 0, meals: [] }, '2026-11-11': { steps: 0, meals: [] } });
  eq(H.syncHealth(s, '2026-11-11'), []); eq(s.entries.length, 0);
});
test('health: a day without steps waits instead of being fined', () => {
  const s = hs({ '2026-11-10': { steps: null, meals: [meal(5000)] } }, { startDate: '2026-11-09' });
  H.syncHealth(s, '2026-11-11'); eq(s.entries.length, 0);
  eq(H.waitingDays(s.health, '2026-11-11'), ['2026-11-10', '2026-11-09']);
});
test('health: an early, short step count waits for the final count', () => {
  const at = (h, m) => { const d = C.parseDate('2026-11-10'); d.setHours(h, m); return d.getTime(); };
  const s = hs({ '2026-11-10': { steps: 4000, stepsAt: at(15, 0), meals: [] } });
  H.syncHealth(s, '2026-11-11'); eq(s.entries.length, 0, 'not fined on a 3 PM count');
  s.health.days['2026-11-10'].stepsAt = at(23, 59); H.syncHealth(s, '2026-11-11'); eq(s.entries.length, 1, '11:59 PM count settles');
  const g = hs({ '2026-11-10': { steps: 10500, stepsAt: at(15, 0), meals: [] } });
  H.syncHealth(g, '2026-11-11'); eq(g.entries[0].type, 'received', 'goal already hit at 3 PM');
});
test('health: editing a settled day re-settles it; rule changes do not touch settled days', () => {
  const s = hs({ '2026-11-10': { steps: 12000, meals: [meal(1500)] } });
  H.syncHealth(s, '2026-11-11'); eq(C.balances(s).total, 50000);
  s.health.days['2026-11-10'].meals.push(meal(900)); // forgot dinner: now 2,400 = 400 over, under the 500 margin
  eq(H.syncHealth(s, '2026-11-11'), []);
  s.health.days['2026-11-10'].meals.push(meal(200, true));
  eq(H.syncHealth(s, '2026-11-11').map((c) => c.delta), [-100000]); eq(C.balances(s).total, -50000);
  s.health.penalty = 500000; s.health.reward = 0; eq(H.syncHealth(s, '2026-11-11'), [], 'frozen rules');
  s.health.days['2026-11-10'].meals.pop(); H.syncHealth(s, '2026-11-11'); eq(C.balances(s).total, 50000, 'removing the cheat meal refunds');
});
test('health: parse steps from shortcut text and links', () => {
  eq(H.parseSteps('2026-11-10=12034'), { '2026-11-10': 12034 });
  eq(H.parseSteps('2026-11-09: 8,250.0\n2026-11-10=12034'), { '2026-11-09': 8250, '2026-11-10': 12034 });
  eq(H.parseSteps('12034', '2026-11-10'), { '2026-11-10': 12034 }); eq(H.parseSteps('hello', '2026-11-10'), {});
  eq(H.parseSteps(decodeURIComponent('2026-11-10%3D9000')), { '2026-11-10': 9000 });
});
test('health: old saved data gets health defaults', () => {
  const st = S.parseBackup(JSON.stringify({ state: { accounts: [{ id: 'a', name: 'A' }], entries: [] } }));
  eq(st.health.enabled, false); eq(st.health.stepGoal, 10000); eq(st.health.penalty, 100000); eq(st.health.days, {});
});

// ---------- nutrition & foods ----------
test('targets: adult, Mifflin-St Jeor, lose 0.5 kg/week', () => {
  const t = N.targets({ sex: 'male', age: 30, heightCm: 175, weightKg: 80, activity: 'light', goal: 'lose', pace: 0.5 });
  eq(t.bmr, 1749); eq(t.maintenance, Math.round(1749 * 1.375)); eq(t.target, Math.round(t.maintenance - 550));
  if (t.protein < 100 || t.fat < 50) throw new Error('macros look off');
});
test('targets: under 18 caps the pace, holds at resting burn, carbs ≥ 130 g', () => {
  const t = N.targets({ sex: 'male', age: 16, heightCm: 183, weightKg: 123.5, bodyFat: 48, activity: 'sedentary', goal: 'lose', pace: 1 });
  eq(t.teen, true); if (t.pace > 0.5) throw new Error('pace not capped');
  if (t.target < t.bmr) throw new Error('below resting burn'); if (t.carbs < 130) throw new Error('carbs under 130');
  if (!t.notes.some((n) => /doctor/i.test(n.t))) throw new Error('no doctor note');
});
test('targets: never below resting burn for adults either', () => {
  const t = N.targets({ sex: 'female', age: 40, heightCm: 155, weightKg: 52, activity: 'sedentary', goal: 'lose', pace: 1 });
  if (t.target < t.bmr) throw new Error('below bmr');
});
test('BMI and no adult label under 18', () => { eq(N.bmi({ heightCm: 180, weightKg: 81 }), 25); eq(N.bmiLabel(25, 16), null); eq(N.bmiLabel(22, 30), 'Healthy'); });
test('scale by grams and by servings', () => {
  const f = { serving: { label: '1 pack', g: 70 }, n: { kcal: 310, p: 7, c: 44, f: 12, fib: 2, sug: 1.5, na: 1100 } };
  eq(N.scale(f, { servings: 2 }).kcal, 620); eq(N.scale(f, { g: 35 }).kcal, 155); eq(N.scale(f, { g: 35 }).p, 3.5);
  eq(N.amountLabel(f, { servings: 0.5 }), '½ × 1 pack'); eq(N.amountLabel(f, { g: 140 }), '140 g');
});
test('nutrient totals add up', () => { const t = N.totals([{ kcal: 100, p: 5 }, { kcal: 250.4, p: 2.25, na: 10 }]); eq([t.kcal, t.p, t.na, t.f], [350, 7.3, 10, 0]); });
test('Open Food Facts product → food (incl. prepared-only values)', () => {
  const f = N.offToFood('890', { product_name: 'Maggi', brands: 'Nestlé, Maggi', serving_quantity: 70, nutriments: { 'energy-kcal_prepared_100g': 384, proteins_100g: 8, sodium_100g: 1.2 } });
  eq([f.n.kcal, f.n.p, f.n.na, f.brand, f.usualG], [384, 8, 1200, 'Nestlé', 70]);
  eq(N.offToFood('1', { nutriments: {} }), null);
  eq(N.offToFood('2', { nutriments: { 'energy-kj_100g': 1674 } }).n.kcal, 400);
});
test('label OCR text → nutrients (per 100 g column)', () => {
  const r = N.parseLabel(`NUTRITION INFORMATION
Per 100 g  Per serve (30 g)
Energy (kcal) 512 154
Protein (g) 7.2 2.2
Carbohydrate (g) 58.4 17.5
Total Sugars (g) 4.1 1.2
Added Sugars (g) 3.0 0.9
Dietary Fibre (g) 2.5 0.8
Total Fat (g) 27.6 8.3
Saturated Fat (g) 12.0 3.6
Sodium (mg) 650 195`);
  eq(r.n, { kcal: 512, p: 7.2, c: 58.4, f: 27.6, fib: 2.5, sug: 4.1, na: 650 }); eq(r.per100, true); eq(r.servingG, 30);
});
test('label with kJ and kcal on one line, comma decimals', () => {
  const r = N.parseLabel('Energy 1674 kJ / 400 kcal\nProtein 10,5 g\nFat 20 g\nCarbohydrates 45 g');
  eq([r.n.kcal, r.n.p, r.n.f, r.n.c], [400, 10.5, 20, 45]);
});
test('food search finds Indian dishes and chain menus', () => {
  const top = (q) => F.searchFoods(q)[0]?.name;
  eq(top('dal tadka restaurant'), 'Dal tadka (restaurant)'); eq(top('maggie'), 'Maggi 2-Minute Masala Noodles');
  eq(top('farmhouse'), 'Farmhouse'); eq(F.searchFoods('farmhouse').some((f) => f.serving.label.startsWith('Medium')), true);
  eq(F.searchFoods('veggie delite').some((f) => f.serving.label === 'Footlong' && f.n.kcal === 460), true);
  eq(top('california burrito chicken').includes('Chicken'), true); eq(top('chole'), 'Chole (home)');
  eq(F.searchFoods('', [], { brandGroup: 'Taco Bell' }).length >= 15, true);
});
test('food database is sane: energy roughly matches macros', () => {
  const bad = F.FOODS.filter((f) => { if (/beer/i.test(f.name)) return false; const e = 4 * f.n.p + 4 * f.n.c + 9 * f.n.f; return f.n.kcal > 40 && Math.abs(e - f.n.kcal) / f.n.kcal > 0.3; });
  if (bad.length) throw new Error(bad.slice(0, 5).map((f) => `${f.name} ${f.n.kcal} vs ${Math.round(4 * f.n.p + 4 * f.n.c + 9 * f.n.f)}`).join('; '));
  const ids = new Set(F.FOODS.map((f) => f.id)); eq(ids.size, F.FOODS.length, 'unique ids');
});

test('amounts are read the way people type them', () => {
  eq(C.parseAmount('1,200'), 120000); eq(C.parseAmount('₹500/-'), 50000); eq(C.parseAmount('Rs. 80'), 8000);
  eq(C.parseAmount('1.5k'), 150000); eq(C.parseAmount('2 lakh'), 20000000); eq(C.parseAmount('120+80'), 20000);
  eq(C.parseAmount('12.50'), 1250); eq(C.parseAmount('3x40'), 12000);
  eq(Number.isNaN(C.parseAmount('')), true); eq(Number.isNaN(C.parseAmount('abc')), true); eq(Number.isNaN(C.parseAmount('1.2.3')), true);
});
test('most used first', () => {
  const ents = [{ categoryId: 'b' }, { categoryId: 'c' }, { categoryId: 'b' }, { categoryId: null }, { categoryId: 'c' }, { categoryId: 'c' }];
  const u = C.usage(ents, 'categoryId');
  eq(C.byUsage([{ id: 'a' }, { id: 'b' }, { id: 'c' }, { id: 'd' }], u).map((x) => x.id), ['c', 'b', 'a', 'd']);
  eq(C.mostUsed(u, 'z'), 'c'); eq(C.mostUsed(new Map(), 'z'), 'z'); eq(C.mostUsed(u, 'z', ['b', 'q']), 'b');
});
test('next bill date respects when the bill starts', () => {
  eq(C.nextBillDate({ day: 5, lastPosted: null, startMonth: '2026-12' }, '2026-11-13'), '2026-12-05');
  eq(C.nextBillDate({ day: 20, lastPosted: null, startMonth: '2026-11' }, '2026-11-13'), '2026-11-20');
  eq(C.nextBillDate({ day: 5, lastPosted: '2026-11' }, '2026-11-13'), '2026-12-05');
  eq(C.nextBillDate({ day: 31, lastPosted: '2027-01' }, '2027-02-01'), '2027-02-28');
});

// ---- weight goal planner (2026-11-14 is a Saturday, so 2026-11-15 is the first Sunday)
const P = { sex: 'male', age: 25, heightCm: 175, bodyFat: null };
const plan = (o) => N.weightPlan({ profile: P, currentKg: 80, targetKg: 77, today: '2026-11-14', targetDate: '2026-12-14', exerciseKcal: 0, exerciseDays: 7, ...o });
test('planner: burn is resting × 1.2 plus the average exercise', () => {
  const a = plan({}), b = plan({ exerciseKcal: 900, exerciseDays: 7 }), c = plan({ exerciseKcal: 900, exerciseDays: 3 });
  eq(a.burn, a.base); eq(b.burn, a.base + 900); eq(c.exAvg, Math.round(900 * 3 / 7));
});
test('planner: 3 kg in 30 days means a deficit of 3 × 7700 / 30 a day', () => {
  const r = plan({ exerciseKcal: 900 });
  eq(r.ok, true); eq(r.dir, 'lose'); eq(r.days, 30); eq(r.asked.deficit, 770); eq(r.tooFast, false);
  eq(Math.abs(r.weekday - (r.burn - 770)) <= 5, true); eq(r.sunday, r.weekday);
});
test('planner: with no exercise, 3 kg in 30 days is too fast, because it would mean eating under the resting burn', () => {
  const r = plan({}); eq(r.tooFast, true); eq(r.reason, 'floor'); eq(r.weekday, Math.round(r.bmr / 5) * 5);
});
test('planner: exercise raises what you can eat, one for one', () => {
  const easy = { targetKg: 79.5 };
  eq(plan({ ...easy, exerciseKcal: 900 }).weekday - plan({ ...easy }).weekday >= 895, true);
});
test('planner: a date that is too soon is held at the safe pace and shows the real date', () => {
  const r = plan({ targetKg: 70, targetDate: '2026-11-28' });
  eq(r.tooFast, true); eq(r.safe.date > '2026-11-28', true); eq(r.weekday >= r.bmr, true); eq(r.paceKgWeek <= 0.8 + 0.001, true); eq(r.endDate, r.safe.date);
});
test('planner: never plans below the resting burn, even with no exercise and a hard date', () => {
  const r = plan({ currentKg: 60, targetKg: 55, targetDate: '2026-11-21' });
  eq(r.tooFast, true); eq(r.weekday >= r.bmr, true);
});
test('planner: Sundays can be bigger, and the other days make it up', () => {
  const same = plan({ exerciseKcal: 900 });
  const sun = plan({ exerciseKcal: 900, sundayKcal: same.weekday + 800 });
  eq(sun.sunday, same.weekday + 800); eq(sun.weekday < same.weekday, true);
  // the whole period still adds up to the same budget (within the 5 kcal rounding)
  const total = (r) => r.weekday * (r.horizon - r.sundays) + r.sunday * r.sundays;
  eq(Math.abs(total(sun) - same.weekday * same.horizon) <= 5 * same.horizon, true); eq(sun.sundays, 5);
});
test('planner: a huge Sunday is capped so other days stay above the resting burn', () => {
  const r = plan({ sundayKcal: 9000 });
  eq(r.sundayAdjusted, true); eq(r.weekday, Math.round(r.bmr / 5) * 5); eq(r.sunday < 9000, true);
});
test('planner: gaining, holding and bad dates', () => {
  const g = plan({ currentKg: 60, targetKg: 63 }); eq(g.dir, 'gain'); eq(g.weekday > g.burn, true);
  eq(plan({ currentKg: 60, targetKg: 60 }).dir, 'hold');
  eq(plan({ targetDate: '2026-11-14' }).ok, false); eq(plan({ targetDate: '2026-11-01' }).why, 'date');
  eq(N.weightPlan({ profile: P, currentKg: 0, targetKg: 70, today: '2026-11-14', targetDate: '2026-12-14' }).ok, false);
});
test('planner: under 18 the pace is held lower', () => {
  const r = N.weightPlan({ profile: { ...P, age: 16 }, currentKg: 80, targetKg: 70, today: '2026-11-14', targetDate: '2026-12-14' });
  eq(r.tooFast, true); eq(r.paceKgWeek <= 0.4 + 0.001, true); eq(r.notes.some((n) => /doctor/i.test(n.t)), true);
});
test('planner progress: on the line, ahead and behind', () => {
  const pl = { startKg: 80, startDate: '2026-11-14', targetKg: 74, targetDate: '2026-12-14' };
  const at = (kg) => N.planProgress(pl, [{ date: '2026-11-29', kg }], '2026-11-29'); // half way: line says 77
  eq(at(77).status, 'on'); eq(at(76).status, 'ahead'); eq(at(78.5).status, 'behind'); eq(at(77).expected, 77); eq(at(77).moved, 3);
});
test('rules: Sundays can have their own calorie goal while a plan drives it', () => {
  const h = { stepGoal: 10000, calorieGoal: 1700, overMargin: 500, reward: 1, penalty: 2, plan: { apply: true }, planSunday: 2300 };
  eq(H.rulesFor(h, '2026-11-15').calorieGoal, 2300); eq(H.rulesFor(h, '2026-11-16').calorieGoal, 1700);
  eq(H.rulesFor({ ...h, plan: { apply: false } }, '2026-11-15').calorieGoal, 1700); eq(H.rulesFor({ ...h, planSunday: null }, '2026-11-15').calorieGoal, 1700);
});

// ---- the food list
test('foods: every id is unique and every row is sensible', () => {
  const ids = new Set();
  for (const f of F.FOODS) {
    if (ids.has(f.id)) throw new Error('duplicate id ' + f.id); ids.add(f.id);
    const n = f.n; if (!(n.kcal >= 0) || !(f.serving.g > 0)) throw new Error('bad row ' + f.name);
    const kc = 4 * n.p + 4 * n.c + 9 * n.f;
    if (kc >= 60 && Math.abs(kc - n.kcal) / kc > 0.35 && !/beer|cola|coke|sprite|thums|maaza|frooti|juice|sting|bull|monster|wine|whisky/i.test(f.name)) throw new Error(`${f.name}: ${n.kcal} kcal but macros say ${Math.round(kc)}`);
  }
  eq(F.FOODS.length >= 1000, true);
});
test('foods: the things you asked for can be found', () => {
  const find = (q) => F.searchFoods(q, [], { limit: 80 }).map((f) => `${f.brand} ${f.name}`.toLowerCase());
  const has = (q, part) => { if (!find(q).some((n) => n.includes(part))) throw new Error(`"${q}" should find "${part}"`); };
  has('kurkure momo', 'kurkure momo'); has('steamed momos', 'steamed'); has('afghani momo', 'afghani'); has('wow momo', 'wow');
  has('besan chilla', 'besan chilla'); has('kadhi', 'without pakoda'); has('kadhi', 'with pakoda'); has('rajma', 'rajma'); has('chole', 'chole');
  has('manchurian', 'manchurian'); has('chowmein', 'chowmein'); has('hakka', 'hakka'); has('thukpa', 'thukpa'); has('roti', 'roti');
  has('bhindi', 'bhindi'); has('broccoli', 'broccoli'); has('papaya', 'papaya'); has('pomegranate', 'pomegranate'); has('pani puri', 'pani puri'); has('chaat', 'chaat');
});
test('foods: groups are browsable', () => {
  for (const g of ['Momos', 'WOW! Momo', 'Indo-Chinese', 'Vegetables', 'Fruits', 'Snacks', 'Fast food', 'Dry fruits & nuts']) {
    if (!F.BRAND_GROUPS.includes(g)) throw new Error('missing group ' + g);
    if (F.searchFoods('', [], { brandGroup: g }).length < 8) throw new Error(g + ' is nearly empty');
  }
});

// ---------- diet filter and new menus (2.2) ----------
test('diet tags come from the name and brand', () => {
  const d = (q) => F.searchFoods(q)[0]?.diet;
  eq(d('dal tadka restaurant'), 'veg'); eq(d('omelette'), 'egg'); eq(d('butter chicken'), 'nonveg'); eq(d('filet fish'), 'nonveg');
  eq(F.dietOf('Zinger Burger', 'KFC'), 'nonveg'); eq(F.dietOf('Veg Zinger Burger', 'KFC'), 'veg');
  eq(F.dietOf('Chicken & Egg Wrap', 'Faasos'), 'nonveg'); eq(F.dietOf('Egg Paneer Wrap', 'Faasos'), 'egg'); eq(F.dietOf('Soya Chaap Masala', 'Indian'), 'veg');
  eq(F.dietOf('Mystery', 'Indian', 'egg'), 'egg');
  eq(F.dietOf('McChicken Burger', "McDonald's"), 'nonveg'); eq(F.dietOf('McEgg Burger', "McDonald's"), 'egg'); eq(F.dietOf('Chickpea salad', 'Indian'), 'veg'); eq(F.dietOf('Hamburger bun', 'Indian'), 'veg');
  eq(F.FOODS.find((f) => f.name === 'Keema paratha').diet, 'nonveg');
});
test('diet filter: veg only, veg + egg, egg + non-veg, all', () => {
  const kinds = (diets, q = 'wrap') => new Set(F.searchFoods(q, [], { limit: 500, diets }).map((f) => f.diet));
  eq([...kinds(['veg'])].sort(), ['veg']); eq([...kinds(['veg', 'egg'])].sort(), ['egg', 'veg']);
  eq([...kinds(['egg', 'nonveg'])].sort(), ['egg', 'nonveg']); eq([...kinds(['veg', 'egg', 'nonveg'])].sort(), ['egg', 'nonveg', 'veg']);
  eq(F.searchFoods('chicken', [], { limit: 50, diets: ['veg'] }).length, 0, 'no chicken in veg mode');
  eq(F.searchFoods('', [], { brandGroup: 'Faasos', diets: ['veg'] }).every((f) => f.diet === 'veg'), true);
});
test('foods with no diet set always show; your own foods are filtered by their diet', () => {
  const mine = [{ id: 'my:1', name: 'Mystery bar', n: { kcal: 100 }, serving: { label: '1', g: 10 }, source: 'hand' }, { id: 'my:2', name: 'Mystery egg thing', n: { kcal: 100 }, serving: { label: '1', g: 10 }, source: 'hand', diet: 'egg' }];
  eq(F.searchFoods('mystery', mine, { diets: ['veg'] }).map((f) => f.id), ['my:1']); eq(F.searchFoods('mystery', mine, { diets: ['egg'] }).length, 2);
});
test('new menus: Haldiram\'s, Faasos, chaap, oils, bigger chains', () => {
  const has = (q, n = 1) => { if (F.searchFoods(q, [], { limit: 500 }).length < n) throw new Error(`"${q}" found fewer than ${n}`); };
  has('haldirams', 60); has('faasos', 35); has('malai chaap'); has('afghani chaap'); has('veerji'); has('chilli mushroom', 2); has('olive oil'); has('mustard oil');
  has('sunflower oil'); has('coconut oil'); has('groundnut oil'); has('rice bran oil'); has('veg biryani', 3); has('raj kachori'); has('aloo bhujia');
  eq(F.FOODS.filter((f) => f.brandGroup === 'Pizza Hut').length >= 55, true, 'Pizza Hut menu with sizes');
  eq(F.FOODS.some((f) => f.brandGroup === 'Pizza Hut' && f.serving.label.startsWith('Medium')), true);
  eq(F.FOODS.filter((f) => f.brandGroup === "McDonald's").length >= 45, true); eq(F.FOODS.filter((f) => f.brandGroup === 'Taco Bell').length >= 30, true);
  eq(F.FOODS.filter((f) => f.brandGroup === 'Subway' && /wrap|salad/i.test(f.name)).length >= 25, true, 'Subway Indian wraps and salads');
  eq(F.FOODS.find((f) => f.name === 'Olive Oil (extra virgin)').n.kcal, 125);
  eq(F.FOODS.filter((f) => /^Haldiram/.test(f.name)).length, 0, 'no stray Haldiram rows outside the group');
});
test('barcode products carry a diet from their ingredients', () => {
  const p = (tags, allergens = []) => N.offToFood('1', { product_name: 'X', nutriments: { 'energy-kcal_100g': 100 }, ingredients_analysis_tags: tags, allergens_tags: allergens });
  eq(p(['en:vegetarian', 'en:vegan']).diet, 'veg'); eq(p(['en:vegetarian'], ['en:eggs']).diet, 'egg'); eq(p(['en:non-vegetarian']).diet, 'nonveg'); eq(p(['en:maybe-vegetarian']).diet, undefined);
});
test('new health data defaults to every diet on', () => { const h = H.defaultHealth(); eq(h.diet, ['veg', 'egg', 'nonveg']); });

// ---------- label reader hardening (2.2.1) ----------
test('label: per-serve column first, with %RDA, still returns per-100 g', () => {
  const r = N.parseLabel(`NUTRITION FACTS
Per serve (30 g)  %RDA  Per 100 g
Energy 154 kcal 8% 512 kcal
Protein 2.2 g 4% 7.2 g
Carbohydrate 17.5 g 7% 58.4 g
Total Sugars 1.2 g 4.1 g
Dietary Fibre 0.8 g 3% 2.5 g
Total Fat 8.3 g 12% 27.6 g
Sodium 195 mg 8% 650 mg`);
  eq(r.n, { kcal: 512, p: 7.2, c: 58.4, f: 27.6, fib: 2.5, sug: 4.1, na: 650 }); eq(r.columns, 'serve-first');
});
test('label: numbers wrapped onto the next line, and letters read for digits', () => {
  const r = N.parseLabel(`Per 100 g
Energy
512 kcal
Protein
7,2 g
Carbohydrate
5O.4 g
Total Fat 2l.6 g
Dietary Fibre 2.5 g`);
  eq([r.n.kcal, r.n.p, r.n.c, r.n.f, r.n.fib], [512, 7.2, 50.4, 21.6, 2.5]);
});
test('label: kJ and kcal together, salt instead of sodium, added sugars never replace total sugars', () => {
  const r = N.parseLabel(`Per 100 g
Energy 2140 kJ / 512 kcal
Protein 7.2 g
Carbohydrate 58.4 g
of which Sugars 4.1 g
Added Sugars 3.0 g
Total Fat 27.6 g
Salt 1.6 g`);
  eq([r.n.kcal, r.n.sug, r.n.na], [512, 4.1, 640]);
  eq(N.parseLabel('Energy 400 kcal\nAdded Sugars 3.0 g').n.sug, 3);
});

test('label: "(g)" read as "(9)" is not a number, and a dropped decimal point is repaired when the numbers show it', () => {
  const r = N.parseLabel(`NUTRITIONAL INFORMATION
Per 100 g  Per serve (30 g)
Energy (kcal) 512 154
Protein (9) 7.2 2.2
Carbohydrate (9) 58.4 17.5
Dietary Fibre (9 2.5 08
Total Fat (9) 276 83
Sodium (mg) 650 195`);
  eq([r.n.kcal, r.n.p, r.n.c, r.n.fib, r.n.f, r.n.na], [512, 7.2, 58.4, 2.5, 27.6, 650]); eq(r.repaired, ['f']); eq(r.check.ok, true);
});
test('label check: numbers that cannot be true are flagged, plausible ones pass', () => {
  eq(N.checkLabel({ kcal: 512, p: 7.2, c: 58.4, f: 27.6, fib: 2.5, sug: 4.1 }).ok, true);
  eq(N.checkLabel({ kcal: 512, p: 72, c: 58.4, f: 27.6 }).ok, false);
  eq(N.checkLabel({ kcal: 512, p: 7.2, c: 5.8, f: 27.6, sug: 12 }).ok, false);
  eq(N.checkLabel({ kcal: 512 }).ok, null);
});

test('label: whole numbers are left alone when the table prints whole numbers', () => {
  const r = N.parseLabel(`Per 100 g
Energy 380 kcal
Protein 10 g
Carbohydrate 60 g
Total Sugars 12 g
Dietary Fibre 15 g
Total Fat 10 g`);
  eq([r.n.p, r.n.c, r.n.sug, r.n.fib, r.n.f], [10, 60, 12, 15, 10]); eq(r.repaired, []);
});
test('label: dropped decimals and a glued-on "g" on fibre and sugar are repaired on one-decimal tables', () => {
  const r = N.parseLabel(`Per 100 g
Energy 512 kcal
Protein 7.2 g
Carbohydrate 58.4 g
Total Sugars 41 g
Dietary Fibre 2.59 g
Total Fat 27.6 g`);
  eq([r.n.sug, r.n.fib], [4.1, 2.5]); eq(r.repaired.sort(), ['fib', 'sug']);
  eq(N.parseLabel(`Per 100 g\nProtein 7.2 g\nCarbohydrate 58.4 g\nTotal Sugars 419 g\nTotal Fat 27.6 g`).n.sug, 4.1);
});

const failed = results.filter((r) => !r[1]);
document.getElementById('sum').innerHTML = failed.length ? `<span class="bad">${failed.length} of ${results.length} failed</span>` : `<span class="ok">All ${results.length} tests passed</span>`;
document.getElementById('out').innerHTML = results.map(([n, ok, m]) => `<div class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${n}${m ? ' — ' + m : ''}</div>`).join('');
window.__results = { total: results.length, failed: failed.map((f) => f[0] + ': ' + f[2]) };
